<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Резултати от тест | NVNACS50</title>
  <link rel="stylesheet" href="../globals.css">
  <style>
    body {
      font-family: var(--font-ui);
      background: var(--sunken);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 24px;
      border-radius: var(--r-card);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px 0;
      color: var(--ink);
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: var(--r-box);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 14px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .results-table {
      background: white;
      border-radius: var(--r-card);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      background: var(--ink-soft);
      color: white;
    }

    th {
      padding: 16px;
      text-align: left;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    td {
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    tbody tr:hover {
      background: var(--sunken);
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    .score-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: var(--r-card);
      font-weight: 600;
      font-size: 14px;
    }

    .score-excellent {
      background: var(--ok-soft);
      color: var(--ok);
    }

    .score-good {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .score-average {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .score-poor {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .loading {
      text-align: center;
      padding: 48px;
    }

    .no-results {
      text-align: center;
      padding: 48px;
      color: var(--muted);
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: var(--r-chip);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: var(--line);
      color: var(--ink);
      margin-right: 8px;
    }

    .btn-secondary:hover {
      background: var(--line-strong);
    }

    .filters {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .filter-input {
      padding: 8px 12px;
      border: 2px solid var(--line);
      border-radius: var(--r-chip);
      font-size: 14px;
      flex: 1;
      max-width: 300px;
    }

    .export-btn {
      margin-left: auto;
    }
  </style>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="../theme.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📊 Резултати от CS50 Тест</h1>
      <p>Преглед на резултатите на студентите</p>
    </div>

    <div class="stats-grid" id="stats-grid">
      <!-- Stats cards will be inserted here -->
    </div>

    <div class="results-table">
      <div class="filters">
        <input type="text" class="filter-input" id="search-filter" placeholder="🔍 Търси по име...">
        <button class="btn btn-secondary" id="sort-by-score">Сортирай по точки</button>
        <button class="btn btn-secondary" id="sort-by-date">Сортирай по дата</button>
        <button class="btn btn-primary export-btn" id="export-btn">📥 Експорт CSV</button>
      </div>

      <div id="loading" class="loading" style="display: none;">
        <p>⏳ Зареждане на резултати...</p>
      </div>

      <div id="no-results" class="no-results" style="display: none;">
        <p>📭 Няма резултати от тестове</p>
      </div>

      <table id="results-table" style="display: none;">
        <thead>
          <tr>
            <th>#</th>
            <th>Потребителско име</th>
            <th>Фак. номер</th>
            <th>Имейл адрес</th>
            <th>Състояние</th>
            <th>Започнат на</th>
            <th>Приключен</th>
            <th>Изминало време</th>
            <th>Оценка/25.00</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody id="results-tbody">
          <!-- Results will be inserted here -->
        </tbody>
      </table>
    </div>

    <div style="margin-top: 24px; text-align: center;">
      <a href="dashboard.html" class="btn btn-secondary">← Назад към Dashboard</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/quiz-storage.js"></script>
  <script src="js/quiz-results-viewer.js"></script>
</body>
</html>
