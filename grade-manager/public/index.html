<!DOCTYPE html>
<html lang="bg" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Classroom - Вход</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Стойностите идват от theme.css — тук само се излагат като класове,
    // за да е един източникът за целия проект.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ground: 'var(--ground)', surface: 'var(--surface)', sunken: 'var(--sunken)',
            line: 'var(--line)', 'line-strong': 'var(--line-strong)',
            ink: 'var(--ink)', 'ink-soft': 'var(--ink-soft)', muted: 'var(--muted)',
            primary: 'var(--primary)', 'primary-hover': 'var(--primary-hover)',
            'primary-soft': 'var(--primary-soft)', 'on-primary': 'var(--on-primary)',
            progress: 'var(--progress)',
            ok: 'var(--ok)', 'ok-soft': 'var(--ok-soft)',
            warn: 'var(--warn)', 'warn-soft': 'var(--warn-soft)',
            danger: 'var(--danger)', 'danger-soft': 'var(--danger-soft)',
            off: 'var(--off)', 'off-soft': 'var(--off-soft)',
          },
          borderRadius: {
            card: 'var(--r-card)', box: 'var(--r-box)',
            chip: 'var(--r-chip)', pill: 'var(--r-pill)',
          },
          boxShadow: { card: 'var(--shadow-card)', lift: 'var(--shadow-lift)' },
          fontFamily: { ui: ['var(--font-ui)'], mono: ['var(--font-mono)'] },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="theme.css">
</head>
<body class="h-full bg-ground">
  <div class="min-h-full flex items-center justify-center py-8 sm:py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 sm:space-y-8">
      <!-- Logo and Title -->
      <div class="text-center">
        <div class="mx-auto h-16 w-16 sm:h-20 sm:w-20 bg-primary rounded-card flex items-center justify-center shadow-lg">
          <span class="text-3xl sm:text-4xl">📚</span>
        </div>
        <h2 class="mt-4 sm:mt-6 text-3xl sm:text-4xl font-extrabold text-ink">
          GitHub Classroom
        </h2>
        <p class="mt-2 text-sm text-ink-soft">
          Управление на оценки и задачи
        </p>
      </div>

      <!-- Login Card -->
      <div class="bg-surface rounded-card shadow-lift p-6 sm:p-8 border border-line">
        <div class="space-y-5 sm:space-y-6">
          <!-- Login Button -->
          <button id="github-login"
                  class="group relative w-full flex justify-center items-center gap-3 py-3.5 sm:py-4 px-4 border border-transparent text-sm font-medium rounded-card text-white bg-ink focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-line-strong transition-all duration-200 shadow-lg hover:shadow-lift transform hover:-translate-y-0.5">
            <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>Влез с GitHub</span>
          </button>

          <!-- Info Box -->
          <div class="bg-sunken border border-line rounded-card p-3.5 sm:p-4">
            <div class="flex items-start gap-2.5 sm:gap-3">
              <div class="flex-shrink-0 mt-0.5">
                <div class="h-7 w-7 sm:h-8 sm:w-8 bg-primary-soft rounded-box flex items-center justify-center">
                  <svg class="h-4 w-4 sm:h-5 sm:w-5 text-primary" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                  </svg>
                </div>
              </div>
              <div class="flex-1 min-w-0">
                <h3 class="text-sm font-semibold text-ink mb-2">
                  Автоматично определяне на роля
                </h3>
                <div class="text-xs text-ink-soft space-y-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-chip text-xs font-medium bg-primary-soft text-primary flex-shrink-0">
                      Owner/Admin
                    </span>
                    <span class="flex items-center gap-1">
                      <svg class="h-3 w-3 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                      </svg>
                      Преподавател
                    </span>
                  </div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="inline-flex items-center px-2 py-0.5 rounded-chip text-xs font-medium bg-primary-soft text-primary flex-shrink-0">
                      Member
                    </span>
                    <span class="flex items-center gap-1">
                      <svg class="h-3 w-3 text-muted" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                      </svg>
                      Студент
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center space-y-2">
        <p class="text-xs text-muted">
          Организация: <span class="font-semibold text-ink-soft">nvnacs50</span>
        </p>
        <div class="flex items-center justify-center gap-1 text-xs text-muted">
          <svg class="h-3 w-3" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
          <span>Система за управление на оценки</span>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    // Check if already authenticated
    const token = localStorage.getItem('gh_token');
    const userRole = localStorage.getItem('gh_role');

    if (token && userRole) {
      // Already logged in - redirect to appropriate dashboard
      if (userRole === 'teacher') {
        window.location.href = '/nvnacs50-dashboard/teacher/';
      } else {
        window.location.href = '/nvnacs50-dashboard/student/dashboard.html';
      }
    }

    // Login button handler
    document.getElementById('github-login').addEventListener('click', () => {
      const clientId = CONFIG.GITHUB_CLIENT_ID;
      const redirectUri = CONFIG.REDIRECT_URI;
      const scope = 'read:user read:org repo';

      // Generate random state for CSRF protection
      const state = Math.random().toString(36).substring(2, 15) +
                   Math.random().toString(36).substring(2, 15);
      sessionStorage.setItem('oauth_state', state);

      const authUrl = `https://github.com/login/oauth/authorize?` +
        `client_id=${clientId}&` +
        `redirect_uri=${encodeURIComponent(redirectUri)}&` +
        `scope=${encodeURIComponent(scope)}&` +
        `state=${state}`;

      window.location.href = authUrl;
    });
  </script>
</body>
</html>
