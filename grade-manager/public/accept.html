<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Задача — CS50</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="theme.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font-ui);
    background: var(--ground);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.55;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--shadow-lift);
    padding: 2rem;
    max-width: 420px;
    width: 100%;
  }

  /* Квадратчето носи номера на седмицата от курса — същото както в
   * учителското табло, за да е ясно, че е един и същи продукт. */
  .week {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 2.75rem;
    height: 2.75rem;
    border-radius: var(--r-box);
    font-weight: 700;
    font-size: 1rem;
    background: var(--wk1-soft);
    color: var(--wk1);
  }
  .week-note {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .head { display: flex; align-items: center; gap: 0.85rem; }

  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-top: 1.5rem;
    text-wrap: balance;
  }
  .slug {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 0.15rem;
  }
  .say { color: var(--ink-soft); font-size: 0.92rem; margin-top: 1rem; }

  .btn {
    display: block;
    width: 100%;
    margin-top: 1.5rem;
    padding: 0.8rem 1rem;
    border: 0;
    border-radius: var(--r-box);
    background: var(--primary);
    color: var(--on-primary);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.15s;
  }
  .btn:hover { background: var(--primary-hover); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .repo {
    margin-top: 1rem;
    padding: 0.7rem 0.8rem;
    background: var(--sunken);
    border: 1px solid var(--line);
    border-radius: var(--r-box);
    font-family: var(--font-mono);
    font-size: 0.8rem;
    overflow-x: auto;
    white-space: nowrap;
  }

  .badge {
    display: inline-block;
    margin-top: 1rem;
    padding: 0.25rem 0.65rem;
    border-radius: var(--r-pill);
    font-size: 0.72rem;
    font-weight: 700;
    background: var(--ok-soft);
    color: var(--ok);
  }

  .spinner {
    width: 2rem;
    height: 2rem;
    margin: 1.5rem auto 0;
    border: 3px solid var(--line);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation-duration: 3s; }
    .btn { transition: none; }
  }

  .error {
    margin-top: 1.25rem;
    padding: 0.85rem 1rem;
    border-radius: var(--r-box);
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 0.88rem;
  }

  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <span class="week" id="week">·</span>
    <span class="week-note" id="week-note">Задача</span>
  </div>

  <h1 id="heading">Задача</h1>
  <div class="slug" id="slug"></div>

  <div id="intro" hidden>
    <p class="say" id="intro-text">Влез с GitHub, за да получиш своето repo за тази задача.</p>
    <button class="btn" id="login">Влез с GitHub</button>
  </div>

  <div id="working" hidden>
    <p class="say">Подготвяме repo-то ти…</p>
    <div class="spinner"></div>
  </div>

  <div id="done" hidden>
    <span class="badge" id="badge">Готово</span>
    <div class="repo" id="repo-name"></div>
    <a class="btn" id="open" href="#">Отвори repo-то</a>
  </div>

  <div class="error" id="error" hidden></div>
</div>

<script src="config.js"></script>
<script>
  // В коя седмица от CS50 е всяка задача. Същата карта както в учителското
  // табло — оттам идва и цветът.
  const WEEK = {
    hello: 1, 'mario-less': 1, 'mario-more': 1, cash: 1, credit: 1,
    scrabble: 2, readability: 2, caesar: 2, substitution: 2,
    sort: 3, plurality: 3, runoff: 3, tideman: 3,
    volume: 4, 'filter-less': 4, 'filter-more': 4, recover: 4,
    inheritance: 5, speller: 5
  };
  const WEEK_LABEL = {
    1: 'Функции', 2: 'Масиви', 3: 'Алгоритми', 4: 'Памет', 5: 'Структури от данни'
  };

  const params = new URLSearchParams(window.location.search);
  const slug = params.get('a') || '';

  const el = (id) => document.getElementById(id);
  const show = (id) => { el(id).hidden = false; };
  const hide = (id) => { el(id).hidden = true; };

  function showError(message) {
    hide('working'); hide('intro');
    el('error').textContent = message;
    show('error');
  }

  el('slug').textContent = slug;

  if (WEEK[slug]) {
    const w = WEEK[slug];
    el('week').textContent = w;
    el('week').style.background = `var(--wk${w}-soft)`;
    el('week').style.color = `var(--wk${w})`;
    el('week-note').textContent = `Седмица ${w} · ${WEEK_LABEL[w]}`;
  }

  if (!slug) {
    showError('Линкът е непълен. Пиши на преподавателя.');
  } else {
    start();
  }

  async function start() {
    // Заглавието идва от Worker-а, за да не се дублира списъкът със задачи тук.
    try {
      const res = await fetch(`${CONFIG.ASSIGNMENTS_WORKER_URL}/assignments`);
      const list = await res.json();
      const found = list.find(a => a.slug === slug);
      if (found) {
        el('heading').textContent = found.title;
        document.title = `${found.title} — CS50`;
      }
    } catch (e) {
      // Заглавието е козметика — ако не се зареди, продължаваме със slug-а.
    }

    const token = localStorage.getItem('gh_token');
    if (token) {
      accept(token);
    } else {
      show('intro');
    }
  }

  el('login').addEventListener('click', () => {
    // callback.html връща тук по тази следа, за да не се пипат
    // регистрираните callback URL-и на OAuth App-а.
    sessionStorage.setItem('pending_assignment', slug);

    const state = crypto.randomUUID();
    sessionStorage.setItem('oauth_state', state);

    const url = 'https://github.com/login/oauth/authorize'
      + `?client_id=${CONFIG.GITHUB_CLIENT_ID}`
      + `&redirect_uri=${encodeURIComponent(CONFIG.REDIRECT_URI)}`
      + `&scope=${encodeURIComponent('read:user repo')}`
      + `&state=${state}`;
    window.location.href = url;
  });

  async function accept(token) {
    hide('intro');
    show('working');

    let res, data;
    try {
      res = await fetch(`${CONFIG.ASSIGNMENTS_WORKER_URL}/accept`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ assignment: slug })
      });
      data = await res.json();
    } catch (e) {
      showError('Няма връзка със сървъра. Провери интернета и опитай пак.');
      return;
    }

    if (res.status === 401) {
      localStorage.removeItem('gh_token');
      hide('working');
      show('intro');
      el('intro-text').textContent = 'Влизането е изтекло. Влез отново, за да получиш задачата.';
      return;
    }

    if (!res.ok) {
      showError(data.message || 'Нещо се обърка. Пиши на преподавателя.');
      return;
    }

    hide('working');
    el('badge').textContent = data.created ? 'Готово, задачата е твоя' : 'Вече имаш repo';
    el('repo-name').textContent = data.repo;
    el('open').href = data.url;
    show('done');
  }
</script>
</body>
</html>
